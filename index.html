<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sal’s Strawberry Saloon</title>
  <link rel="stylesheet" href="style.css" />
  <!-- firebase start ****************************************-->
  <!-- Firebase App (core Firebase SDK) is always required & must be listed 1st -->
  <script src="https://www.gstatic.com/firebasejs/8.1.2/firebase-app.js"></script>
  <!-- Add Firebase products that you want to use -->
  <script src="https://www.gstatic.com/firebasejs/8.1.2/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.1.2/firebase-database.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.1.2/firebase-analytics.js"></script>
  <!-- firebase end ******************************************-->
  <script src="fb_setup.js"></script>
</head>

<body>
  <div class="container">
    <div id="profile" class="profile"></div>
      <div id="profileinfo" class="profileinfo"></div>
    <h1>Sal’s Strawberry Saloon</h1>

    <button onclick="fb_authenticate()" id="loginButton">Login with Google</button>
    <button onclick="generate_email()" id="emailButton">Generate Email</button>
    <button onclick="viewFavFruits()" id="viewFavFruitsButton">View Favourite Fruits</button>

    <form id="fruitForm">
      <label for="name">Your Name:</label>
      <input type="text" id="name" name="name" required />

      <label for="favoriteFruit">Favorite Fruit:</label>
      <input type="text" id="favoriteFruit" name="favoriteFruit" required />

      <label for="2favoriteFruit">Second Favorite Fruit:</label>
      <input type="text" id="2favoriteFruit" name="2favoriteFruit" required />

      <label for="3favoriteFruit">Third Favorite Fruit:</label>
      <input type="text" id="3favoriteFruit" name="3favoriteFruit" required />

      <label for="fruitQuantity">How many servings per week?</label>
      <input type="number" id="fruitQuantity" name="fruitQuantity" required />

      <label for="review">Leave a Review:</label>
      <input type="text" id="review" name="review" />
    </form>

    <button onclick="fb_write()" id="writeButton">Submit</button>

    <p id="statusMessage"></p>
  </div>
  <script src="script.js"></script>
</body>

</html>
